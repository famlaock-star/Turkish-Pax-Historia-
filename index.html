<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pax Historia - Türkiye Bölgeleri</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#79bde8;
}

#map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

.country{
    stroke:#444;
    stroke-width:.45px;
    vector-effect:non-scaling-stroke;
}

.borders{
    fill:none;
    stroke:#333;
    stroke-width:.5px;
    vector-effect:non-scaling-stroke;
}

/* TÜRKİYE BÖLGELERİ */

.region{
    stroke:#333;
    stroke-width:1.2px;
    cursor:pointer;
    vector-effect:non-scaling-stroke;
}

.region:hover{
    filter:brightness(1.12);
    stroke:#111;
    stroke-width:2px;
}

/* BİLGİ KARTI */

#regionInfo{
    position:fixed;
    z-index:100;
    left:15px;
    bottom:20px;
    width:min(370px,90vw);
    background:white;
    border-radius:18px;
    box-shadow:0 6px 25px #0005;
    display:none;
    overflow:hidden;
}

#regionHead{
    padding:18px;
    background:#303942;
    color:white;
}

#regionName{
    font-size:24px;
    font-weight:bold;
}

#regionText{
    padding:18px;
    font-size:17px;
    color:#444;
}

#closeRegion{
    position:absolute;
    right:10px;
    top:10px;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#ffffffdd;
    font-size:24px;
}

/* GERİ */

#backTurkey{
    position:fixed;
    z-index:90;
    top:15px;
    left:15px;
    display:none;
    border:0;
    border-radius:12px;
    padding:12px 16px;
    background:#20252b;
    color:white;
    font-weight:bold;
    box-shadow:0 4px 12px #0005;
}
</style>
</head>

<body>

<svg id="map"></svg>

<button id="backTurkey">
    ← Dünya Haritası
</button>

<div id="regionInfo">

    <button id="closeRegion">×</button>

    <div id="regionHead">
        <div id="regionName"></div>
    </div>

    <div id="regionText"></div>

</div>

<script>

const svg = d3.select("#map");
const W = innerWidth;
const H = innerHeight;

svg.attr("viewBox",`0 0 ${W} ${H}`);

const mapLayer = svg.append("g");

const projection =
    d3.geoNaturalEarth1()
    .scale(W * .34)
    .translate([W/2,H/2]);

const path =
    d3.geoPath()
    .projection(projection);


/* =====================================================
   DÜNYA HARİTASI
===================================================== */

async function loadWorld(){

    const world =
        await d3.json(
            "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"
        );

    const countries =
        topojson.feature(
            world,
            world.objects.countries
        ).features;


    mapLayer
    .selectAll(".country")
    .data(countries)
    .join("path")
    .attr("class","country")
    .attr("d",path)
    .attr("fill",(d,i)=>{

        if(String(d.id)==="792"){
            return "#c91f2b";
        }

        const colors=[
            "#b94a48",
            "#c96a4b",
            "#d6a84f",
            "#8d9b55",
            "#668f65",
            "#4f8291",
            "#6680a8",
            "#766c9b",
            "#a06b91",
            "#9a825e"
        ];

        return colors[i%colors.length];

    })
    .on("click",(event,d)=>{

        if(String(d.id)==="792"){
            showTurkey();
        }

    });


    mapLayer
    .append("path")
    .datum(
        topojson.mesh(
            world,
            world.objects.countries,
            (a,b)=>a!==b
        )
    )
    .attr("class","borders")
    .attr("d",path);

}

loadWorld();


/* =====================================================
   TÜRKİYE'NİN 7 BÖLGESİ
=====================================================

   Burada bölge geometrileri ayrı veri olarak yükleniyor.
   İller gösterilmiyor.
===================================================== */

const regionLayer =
    mapLayer
    .append("g")
    .style("display","none");


const regionData = [

    {
        name:"Marmara Bölgesi",
        color:"#d96b6b",
        x:0.49,
        y:0.31,
        w:0.15,
        h:0.12
    },

    {
        name:"Ege Bölgesi",
        color:"#d99a52",
        x:0.43,
        y:0.40,
        w:0.13,
        h:0.18
    },

    {
        name:"Akdeniz Bölgesi",
        color:"#d6c052",
        x:0.47,
        y:0.55,
        w:0.17,
        h:0.13
    },

    {
        name:"İç Anadolu Bölgesi",
        color:"#8da45d",
        x:0.56,
        y:0.42,
        w:0.18,
        h:0.16
    },

    {
        name:"Karadeniz Bölgesi",
        color:"#58916b",
        x:0.57,
        y:0.29,
        w:0.21,
        h:0.13
    },

    {
        name:"Doğu Anadolu Bölgesi",
        color:"#6588ad",
        x:0.72,
        y:0.39,
        w:0.18,
        h:0.22
    },

    {
        name:"Güneydoğu Anadolu Bölgesi",
        color:"#8872a7",
        x:0.76,
        y:0.57,
        w:0.13,
        h:0.12
    }

];


/*
   Türkiye görünümüne geçince bölgeleri
   Türkiye alanında görsel olarak yerleştiriyoruz.
*/

function showTurkey(){

    document.querySelector(
        "#backTurkey"
    ).style.display="block";

    regionLayer
    .style("display",null);

    mapLayer
    .selectAll(".country")
    .style("opacity",d =>
        String(d.id)==="792" ? 0 : 0.12
    );

    mapLayer
    .selectAll(".borders")
    .style("opacity",0.1);


    const scale = Math.min(W,H);

    regionLayer
    .selectAll(".region")
    .data(regionData)
    .join("rect")
    .attr("class","region")
    .attr("x",d=>W*d.x)
    .attr("y",d=>H*d.y)
    .attr("width",d=>W*d.w)
    .attr("height",d=>H*d.h)
    .attr("rx",8)
    .attr("fill",d=>d.color)
    .attr("fill-opacity",.88)
    .on("click",(event,d)=>{

        event.stopPropagation();

        document.querySelector(
            "#regionName"
        ).textContent=d.name;

        document.querySelector(
            "#regionText"
        ).textContent=
            d.name+
            " seçildi.";

        document.querySelector(
            "#regionInfo"
        ).style.display="block";

    });

}


function hideTurkey(){

    document.querySelector(
        "#backTurkey"
    ).style.display="none";

    document.querySelector(
        "#regionInfo"
    ).style.display="none";

    regionLayer
    .style("display","none");

    mapLayer
    .selectAll(".country")
    .style("opacity",1);

    mapLayer
    .selectAll(".borders")
    .style("opacity",1);

}


document.querySelector(
    "#backTurkey"
).onclick=hideTurkey;


document.querySelector(
    "#closeRegion"
).onclick=()=>{

    document.querySelector(
        "#regionInfo"
    ).style.display="none";

};

</script>

</body>
</html>
