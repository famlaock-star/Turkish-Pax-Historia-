<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#b8c7cf;
}

/* ================= MAP ================= */

#map{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:1;
    touch-action:none;
}

.country{
    stroke:#555;
    stroke-width:.45px;
    vector-effect:non-scaling-stroke;
}

.borders{
    fill:none;
    stroke:#444;
    stroke-width:.55px;
    vector-effect:non-scaling-stroke;
}

/* ================= MAIN BUTTONS ================= */

.mainBtn{
    position:fixed;
    bottom:10px;
    z-index:10000;

    border:2px solid #555;
    border-radius:12px;

    background:#20252b;
    color:white;

    padding:11px 14px;

    font-size:14px;
    font-weight:bold;

    box-shadow:0 4px 12px #0008;

    cursor:pointer;
    touch-action:manipulation;
}

#chatButton{
    left:10px;
}

#advisorButton{
    right:10px;
}

/* ================= SCREENS ================= */

.screen{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    z-index:50000;

    display:none;
    flex-direction:column;

    background:#fff;
    color:#222;
}

/* ================= TOP ================= */

.top{
    height:58px;
    min-height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:7px 10px;

    border-bottom:1px solid #ddd;
    background:white;
}

.top button{
    border:1px solid #bbb;
    border-radius:8px;

    padding:8px 10px;

    background:#f3f3f3;
    color:#222;

    font-size:14px;

    cursor:pointer;
    touch-action:manipulation;
}

.title{
    font-size:16px;
    font-weight:bold;
    text-align:center;
}

/* ================= CHAT HOME ================= */

.chatMain{
    flex:1;
    overflow-y:auto;
    padding:12px;
}

.savedTitle{
    font-weight:bold;
    margin:5px 0 10px;
}

.savedChat{
    width:100%;

    display:block;

    padding:13px;
    margin-bottom:8px;

    border:1px solid #ddd;
    border-radius:10px;

    background:#f7f7f7;

    text-align:left;
    font-weight:bold;
    font-size:14px;

    cursor:pointer;
}

.savedChat:active{
    background:#e7e7e7;
}

.savedPreview{
    display:block;
    margin-top:5px;

    font-size:12px;
    font-weight:normal;
    color:#777;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.chatEmpty{
    height:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;
    text-align:center;
}

.bigIcon{
    font-size:55px;
    margin-bottom:10px;
}

/* ================= COUNTRY SELECT ================= */

.countrySearch{
    padding:10px;
    border-bottom:1px solid #ddd;
}

#countrySearch{
    width:100%;
    height:43px;

    border:1px solid #bbb;
    border-radius:9px;

    padding:0 13px;

    outline:none;

    font-size:15px;
}

#countryList{
    flex:1;

    overflow-y:auto;

    padding:5px 10px;
}

.countryItem{
    width:100%;

    display:flex;
    align-items:center;

    gap:12px;

    padding:12px 8px;

    border:0;
    border-bottom:1px solid #eee;

    background:white;

    text-align:left;
    font-size:15px;

    cursor:pointer;
}

.countryItem.selected{
    background:#b9f0c0;
    border:2px solid #35a54a;
}

.countryItem:active{
    background:#dff5e2;
}

.flag{
    width:35px;
    font-size:25px;
    text-align:center;
}

/* ================= SELECTED ================= */

.selectedArea{
    padding:10px;

    border-top:1px solid #ddd;

    background:#fafafa;
}

.selectedCountries{
    min-height:35px;

    display:flex;
    gap:6px;
    flex-wrap:wrap;

    margin-bottom:8px;
}

.tag{
    background:#d8f1dc;

    border:1px solid #59a966;
    border-radius:8px;

    padding:6px 9px;

    font-size:13px;
}

#startChat{
    width:100%;
    height:43px;

    border:0;
    border-radius:9px;

    background:#303942;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

/* ================= COUNTRY CHAT ================= */

.messages{
    flex:1;

    overflow-y:auto;

    padding:14px;

    scroll-behavior:smooth;
}

.message{
    max-width:82%;

    padding:10px 13px;
    margin:8px 0;

    border-radius:12px;

    line-height:1.4;

    white-space:pre-wrap;
    word-break:break-word;
}

.user{
    margin-left:auto;
    background:#e5edf6;
}

.ai{
    margin-right:auto;
    background:#f0f0f0;
}

.aiName{
    display:block;

    margin-bottom:4px;

    font-size:12px;
    font-weight:bold;

    color:#555;
}

.inputArea{
    display:flex;
    gap:7px;

    padding:9px;

    border-top:1px solid #ddd;

    background:white;
}

#messageInput{
    flex:1;
    min-width:0;

    height:42px;

    border:1px solid #bbb;
    border-radius:9px;

    padding:0 11px;

    outline:none;

    font-size:15px;
}

#sendMessage{
    border:0;
    border-radius:9px;

    padding:0 15px;

    background:#303942;
    color:white;

    font-weight:bold;

    cursor:pointer;
}

.typing{

    font-style:italic;

/* ================= ADVISOR ================= */

    flex:1;

    overflow-y:auto;

    padding:16px;

.advisorMessage{
    max-width:82%;

    padding:11px 13px;
    margin:9px 0;

    border-radius:12px;

    word-break:break-word;
}

.advisorAI{

    background:#f0f0f0;

.advisorInputBox{

/*
   BURAYA KENDİ YENİ GEMINI API KEY'İNİ YAZ.

   Örnek:
   const GEMINI_API_KEY = "AIza...";
*/

const GEMINI_API_KEY = "BURAYA_KEY";


async function callGeminiAPI(prompt){

    if(
        !GEMINI_API_KEY ||
        GEMINI_API_KEY === "BURAYA_KEY"
    ){

        throw new Error(
            "Gemini API anahtarı girilmemiş."
        );

    }

    const url =
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent";


    const response =
        await fetch(url,{

            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "x-goog-api-key":GEMINI_API_KEY
            },

            body:JSON.stringify({

                contents:[

                    {
                        parts:[
                            {
                                text:prompt
                            }
                        ]
                    }

                ]

            })

        });


    const data =
        await response.json();


    if(!response.ok){

        console.error(
            "Gemini API:",
            data
        );

        throw new Error(
            data?.error?.message ||
            "Gemini API hatası."
        );

    }


    const text =
        data
        ?.candidates?.[0]
        ?.content?.parts?.[0]
        ?.text;


    if(!text){

        throw new Error(
            "Gemini boş cevap döndürdü."
        );

    }


    return text.trim();

}

function loadMap(){

    const W =
        window.innerWidth;

    const H =
        window.innerHeight;


    svg.attr(
        "viewBox",
        `0 0 ${W} ${H}`
    );


    const layer =
        svg.append("g");


    const projection =
        d3.geoNaturalEarth1()
        .scale(W * .34)
        .translate([
            W/2,
            H/2
        ]);


    const path =
        d3.geoPath()
        .projection(projection);


    d3.json(
        "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"
    )
    .then(world=>{

        const features =
            topojson.feature(
                world,
                world.objects.countries
            ).features;


        const colors=[

            "#b94a48",
            "#c96a4b",
            "#d6a84f",
            "#8d9b55",
            "#668f65",
            "#4f8291",
            "#6680a8",
            "#766c9b",
            "#a06b91",
            "#9a825e",
            "#737b72",
            "#c27b72",
            "#879c72",
            "#b39b63"

        ];


        layer
        .selectAll(".country")
        .data(features)
        .join("path")

        .attr(
            "class",
            "country"
        )

        .attr(
            "d",
            path
        )

        .attr(
            "fill",
            (d,i)=>{

                if(String(d.id)==="792")
                    return "#c91f2b";

                return colors[
                    i % colors.length
                ];

            }
        );


        const borders =
            topojson.mesh(
                world,
                world.objects.countries,
                (a,b)=>a!==b
            );


        layer
        .append("path")
        .datum(borders)

        .attr(
            "class",
            "borders"
        )

        .attr(
            "d",
            path
        );


        const bounds =
            path.bounds({
                type:"FeatureCollection",
                features
            });


        const left =
            bounds[0][0];

        const top =
            bounds[0][1];

        const right =
            bounds[1][0];

        const bottom =
            bounds[1][1];


        const mapWidth =
            right-left;

        const mapHeight =
            bottom-top;


        const zoom =
            d3.zoom()

            .scaleExtent([
                1,
                8
            ])

            .on(
                "zoom",
                event=>{

                    let k =
                        event.transform.k;

                    let x =
                        event.transform.x;

                    let y =
                        event.transform.y;


                    const mw =
                        mapWidth*k;

                    const mh =
                        mapHeight*k;


                    if(mw<=W){

                        x =
                            (W-mw)/2 -
                            left*k;

                    }else{

                        x =
                            Math.max(
                                W-right*k,
                                Math.min(
                                    -left*k,
                                    x
                                )
                            );

                    }


                    if(mh<=H){

                        y =
                            (H-mh)/2 -
                            top*k;

                    }else{

                        y =
                            Math.max(
                                H-bottom*k,
                                Math.min(
                                    -top*k,
                                    y
                                )
                            );

                    }


                    layer.attr(
                        "transform",
                        `translate(${x},${y}) scale(${k})`
                    );

                }
            );


        svg.call(zoom);

        svg.on(
            "dblclick.zoom",
            null
        );

    })

    .catch(error=>{

        console.error(
            "Harita yüklenemedi:",
            error
        );

    });

}

function renderChatHome(){

            saveData();

/* =====================================================
   COUNTRY SELECT
===================================================== */

countrySearch.oninput=()=>{
    renderCountries();
};


function renderCountries(){

    const search =
        countrySearch
        .value
        .toLocaleLowerCase("tr-TR")
        .trim();


    countryList.innerHTML="";


    countries

    .filter(c=>
        c[1]
        .toLocaleLowerCase("tr-TR")
        .includes(search)
    )

    .forEach(c=>{

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "countryItem";


        if(
            selectedCountries.some(
                x=>x[1]===c[1]
            )
        ){

            button.classList.add(
                "selected"
            );

        }


        button.innerHTML=`

            <span class="flag">
                ${c[0]}
            </span>

            <span>
                ${c[1]}
            </span>

        `;


        button.onclick=()=>{

            const index =
                selectedCountries.findIndex(
                    x=>x[1]===c[1]
                );


            if(index>=0){

                selectedCountries.splice(
                    index,
                    1
                );

            }else{

                selectedCountries.push([
                    c[0],
                    c[1]
                ]);

            }


            saveData();

            renderCountries();

        };


        countryList.appendChild(
            button
        );

    });


    renderSelectedCountries();

}


function renderSelectedCountries(){

    selectedCountriesBox.innerHTML="";


    if(selectedCountries.length===0){

        selectedCountriesBox.innerHTML=`

            <span
            style="
            color:#777;
            font-size:13px;
            ">

                Henüz ülke seçilmedi.

            </span>

        `;

        return;

    }


    selectedCountries.forEach(c=>{

        const tag =
            document.createElement(

            );


        tag.className =
            "tag";

/* =====================================================
   START CHAT
===================================================== */

document.getElementById(
    "startChat"
).onclick=()=>{

    if(
        selectedCountries.length===0
    ){

        alert(
            "En az bir ülke seç."
        );

        return;

    }


    let existing =
        savedData.chats.find(
            c=>
                JSON.stringify(
                    c.countries
                ) ===
                JSON.stringify(
                    selectedCountries
                )
        );


    if(existing){

        activeChatId =
            existing.id;

    }else{

        const chat={

            id:
                Date.now().toString(),

            countries:
                selectedCountries.map(
                    x=>[
                        x[0],
                        x[1]
                    ]
                ),

            messages:[]

        };


        savedData.chats.push(
            chat
        );


        activeChatId =
            chat.id;

    }


    saveData();


    countryScreen.style.display =
        "none";


    openActiveChat();

};

    countryChatScreen.style.display =

        messagesBox.scrollTop =

===================================================== */

        savedData.chats.find(
            c=>c.id===activeChatId

        return;

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(){

    const chat =
        savedData.chats.find(
            c=>c.id===activeChatId
        );


    messagesBox.innerHTML="";


    if(!chat)
        return;


    chat.messages.forEach(msg=>{

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "message "+
            (
                msg.role==="user"
                ? "user"
                : "ai"
            );


        if(msg.country){

            const name =
                document.createElement(
                    "span"
                );


            name.className =
                "aiName";


            name.textContent =
                msg.flag+" "+
                msg.country;


            div.appendChild(name);

        }


        const text =
            document.createElement(
                "span"
            );


        text.textContent =
            msg.text;


        div.appendChild(text);


        messagesBox.appendChild(
            div
        );

    });


    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}

async function sendUserMessage(){

    const text =
        messageInput.value.trim();


    if(!text)
        return;


    const chat =
        savedData.chats.find(
            c=>c.id===activeChatId
        );


    if(!chat)
        return;


    chat.messages.push({

        role:"user",

        text:text

    });


    messageInput.value="";


    saveData();

    renderMessages();


    await generateCountryReplies(
        chat,
        text
    );

}


/* =====================================================
   COUNTRY AI REPLIES
===================================================== */

async function generateCountryReplies(
    chat,
    userText
){

    const sendButton =
        document.getElementById(
            "sendMessage"
        );


    sendButton.disabled=true;

    messageInput.disabled=true;


    try{

        for(
            let i=0;
            i<chat.countries.length;
            i++
        ){

            const country =
                chat.countries[i];


            const previous =
                chat.messages
                .slice(-15)
                .map(m=>{

                    if(
                        m.role==="user"
                    ){

                        return (
                            "Oyuncu: "+
                            m.text
                        );

                    }

                    return (
                        m.country+
                        ": "+
                        m.text
                    );

                })
                .join("\n");


            const prompt=`

Sen Pax Historia adlı strateji oyunundaki bir ülkesin.

Ülke:
${country[1]}

Oyuncunun mesajı:
${userText}

Önceki konuşma:
${previous}

Kurallar:

- Sadece ${country[1]} adına konuş.
- Türkçe cevap ver.
- Ülkenin siyasi ve diplomatik çıkarlarını dikkate al.
- Birden fazla ülke varsa diğer ülkelerin yerine konuşma.
- Gerçek bir ülkeymiş gibi uzun tarih anlatma; oyun içi diplomatik karakter gibi davran.
- Cevabı kısa ve doğal tut.
- Gereksiz açıklama yapma.
- Oyuncuya doğrudan cevap ver.

Şimdi ${country[1]} olarak cevap ver.
`;


            let answer;


            try{

                answer =
                    await callGeminiAPI(
                        prompt
                    );

            }catch(error){

                answer =
                    "⚠️ Yapay zeka yanıt veremedi: "+
                    error.message;

            }


            chat.messages.push({

                role:"ai",

                country:
                    country[1],

                flag:
                    country[0],

                text:
                    answer

            });


            saveData();

            renderMessages();


            /*
              Ülkelerin cevaplarının
              sıra sıra gelmesi için
              küçük bekleme.
            */

            if(
                i<
                chat.countries.length-1
            ){

                await wait(350);

            }

        }

    }finally{

        sendButton.disabled=false;

        messageInput.disabled=false;

        messageInput.focus();

    }

}


function wait(ms){

    return new Promise(
        resolve=>
            setTimeout(
                resolve,
                ms
            )
    );

}
