<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pax Historia Çakması</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: white; font-family: sans-serif; }
        #map { height: 70vh; width: 100vw; background: #0e1e2b; }
        #panel { height: 30vh; padding: 15px; box-sizing: border-box; background: #222; text-align: center; border-top: 2px solid #444; }
        button { padding: 12px 24px; font-size: 16px; background: #c0392b; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button:hover { background: #e74c3c; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="panel">
        <h2 id="ulke-adi">Bir Ülkeye Tıkla</h2>
        <p id="durum">Seçilen ülkeyi fethetmek için alt butonları kullan.</p>
        <button onclick="savasAc()">Savaş Aç / Fethet</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([39.9, 32.8], 3);

        var secilenUlke = null;

        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            fillColor: '#27ae60',
                            weight: 1,
                            opacity: 1,
                            color: '#ffffff',
                            fillOpacity: 0.5
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function(e) {
                            secilenUlke = feature.properties.name;
                            document.getElementById('ulke-adi').innerText = secilenUlke;
                            document.getElementById('durum').innerText = secilenUlke + " seçildi. Hamle yapabilirsin!";
                        });
                    }
                }).addTo(map);
            });

        function savasAc() {
            if(!secilenUlke) {
                alert("Önce haritadan bir ülke seçmelisin!");
                return;
            }
            document.getElementById('durum').innerText = secilenUlke + " ülkesine savaş açıldı!";
        }
    </script>
</body>
</html>
