<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pax Historia Çakması</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: white; font-family: sans-serif; }
        #map { height: 70vh; width: 100vw; }
        #panel { height: 30vh; padding: 15px; box-sizing: border-box; background: #222; text-align: center; }
        button { padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="panel">
        <h2 id="ulke-adi">Bir Ülkeye Tıkla</h2>
        <p id="durum">Oyun Başladı!</p>
        <button onclick="turAtla()">Turu Atla (Savaş)</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([39.9, 32.8], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        function turAtla() {
            document.getElementById('durum').innerText = 'Yapay zeka hamleyi hesaplıyor...';
        }
    </script>
</body>
</html>
