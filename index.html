<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pax Historia Çakması</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: white; font-family: sans-serif; }
        #map { height: 65vh; width: 100vw; background: #0b1721; }
        #panel { height: 35vh; padding: 15px; box-sizing: border-box; background: #1a1a1a; text-align: center; border-top: 2px solid #333; }
        .stats { display: flex; justify-content: space-around; margin: 15px 0; background: #2a2a2a; padding: 10px; border-radius: 8px; }
        .stat-box { font-size: 14px; }
        .stat-box span { display: block; font-size: 18px; font-weight: bold; color: #2ecc71; margin-top: 5px; }
        button { padding: 12px 20px; font-size: 15px; background: #e74c3c; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin: 5px; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="panel">
        <h2 id="ulke-adi">Bir Ülke Seçin</h2>
        
        <div class="stats">
            <div class="stat-box">Ordu Gücü: <span id="asker">-</span></div>
            <div class="stat-box">Ekonomi: <span id="ekonomi">-</span></div>
        </div>

        <p id="durum">Haritadan bir ülke seçip hamleni belirle.</p>
        <button onclick="savasAc()">Savaş İlan Et</button>
        <button onclick="isgalEt()" style="background:#27ae60;">Toprağı Ele Geçir</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([39.9, 32.8], 3);
        var secilenUlke = null;
        var secilenKatman = null;

        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            fillColor: '#34495e',
                            weight: 1,
                            opacity: 1,
                            color: '#ffffff',
                            fillOpacity: 0.6
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function(e) {
                            // Önceki seçili ülkenin rengini sıfırla
                            if(secilenKatman) {
                                secilenKatman.setStyle({ fillColor: '#34495e' });
                            }

                            // Yeni seçilen ülkeyi kırmızı yap
                            secilenKatman = layer;
                            secilenKatman.setStyle({ fillColor: '#e74c3c' });

                            secilenUlke = feature.properties.name;
                            document.getElementById('ulke-adi').innerText = secilenUlke;
                            
                            // Rastgele ordu ve ekonomi değerleri üret (Simülasyon)
                            var asker = Math.floor(Math.random() * 50000) + 5000;
                            var ekonomi = "$" + (Math.floor(Math.random() * 900) + 100) + "M";
                            
                            document.getElementById('asker').innerText = asker.toLocaleString() + " Asker";
                            document.getElementById('ekonomi').innerText = ekonomi;
                            document.getElementById('durum').innerText = secilenUlke + " seçildi. Hamle bekleniyor.";
                        });
                    }
                }).addTo(map);
            });

        function savasAc() {
            if(!secilenUlke) return alert("Önce ülke seç!");
            document.getElementById('durum').innerText = secilenUlke + " ülkesine savaş ilan edildi! Birlikler sınıra kaydırılıyor.";
        }

        function isgalEt() {
            if(!secilenUlke) return alert("Önce ülke seç!");
            document.getElementById('durum').innerText = secilenUlke + " başarıyla işgal edildi! Topraklarımıza katıldı.";
            if(secilenKatman) {
                secilenKatman.setStyle({ fillColor: '#27ae60' }); // İşgal edilince yeşil yap
            }
        }
    </script>
</body>
</html>
