<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pax Historia Çakması</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: white; font-family: sans-serif; overflow: hidden; }
        #map { height: 75vh; width: 100vw; background: #0b1721; }
        #panel { height: 25vh; padding: 15px; box-sizing: border-box; background: #1a1a1a; text-align: center; border-top: 2px solid #333; }
        .stats { display: flex; justify-content: space-around; margin: 10px 0; background: #2a2a2a; padding: 8px; border-radius: 8px; }
        .stat-box { font-size: 13px; }
        .stat-box span { display: block; font-size: 16px; font-weight: bold; color: #2ecc71; margin-top: 3px; }

        /* DANIŞMAN BUTONU VE PENCERESİ */
        #advisor-btn {
            position: fixed; bottom: 20px; right: 20px;
            background: #f39c12; color: #111; border: none;
            padding: 12px 18px; border-radius: 50px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; z-index: 1000;
        }
        #advisor-btn:hover { background: #e67e22; }

        #advisor-chat {
            display: none; position: fixed; bottom: 70px; right: 20px;
            width: 300px; height: 380px; background: #222; border: 2px solid #f39c12;
            border-radius: 10px; z-index: 1000; flex-direction: column;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
        }
        #chat-header { background: #f39c12; color: #111; padding: 10px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #chat-close { cursor: pointer; font-weight: bold; }
        #chat-body { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
        .msg { padding: 8px 12px; border-radius: 6px; max-width: 80%; }
        .bot { background: #333; align-self: flex-start; border-left: 3px solid #f39c12; }
        .user { background: #f39c12; color: #111; align-self: flex-end; font-weight: bold; }
        #chat-input-container { display: flex; padding: 8px; background: #111; }
        #chat-input { flex: 1; padding: 6px; border: none; border-radius: 3px; background: #222; color: white; outline: none; }
        #chat-send { background: #f39c12; color: #111; border: none; padding: 6px 12px; margin-left: 5px; border-radius: 3px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="panel">
        <h2 id="ulke-adi">Bir Ülke Seçin</h2>
        
        <div class="stats">
            <div class="stat-box">Ordu Gücü: <span id="asker">-</span></div>
            <div class="stat-box">Ekonomi: <span id="ekonomi">-</span></div>
        </div>

        <p id="durum">Haritadan bir ülkeye tıklayarak detaylarını inceleyebilirsin.</p>
    </div>

    <!-- DANIŞMAN BUTONU VE SOHBET KUTUSU -->
    <button id="advisor-btn" onclick="toggleChat()">💡 Danışman</button>

    <div id="advisor-chat">
        <div id="chat-header">
            <span>Başdanışman</span>
            <span id="chat-close" onclick="toggleChat()">✖</span>
        </div>
        <div id="chat-body">
            <div class="msg bot">Emredin hünkarım! Haritadaki ülkeler ve stratejimiz hakkında danışabilirsiniz.</div>
        </div>
        <div id="chat-input-container">
            <input type="text" id="chat-input" placeholder="Danışmana soru sor..." onkeypress="handleKeyPress(event)">
            <button id="chat-send" onclick="sendMessage()">Gönder</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([39.9, 32.8], 3);
        var secilenUlke = null;

        // Ülke Renk Haritası
        var ulkeRenkleri = {
            "Turkey": "#e74c3c",          // Türkiye - Kırmızı
            "Greece": "#3498db",          // Yunanistan - Açık Mavi
            "France": "#1a5276",          // Fransa - Koyu Mavi
            "Germany": "#f1c40f",         // Almanya - Sarı
            "Czech Republic": "#2980b9",  // Çekoslovakya / Çekya - Mavi
            "United Kingdom": "#9b59b6",  // İngiltere - Mor
            "Italy": "#27ae60",           // İtalya - Yeşil
            "Russia": "#7f8c8d",          // Rusya - Gri
            "United States of America": "#2e4053", // ABD - Koyu Lacivert
            "Spain": "#e67e22"            // İspanya - Turuncu
        };

        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        var name = feature.properties.name;
                        // Özel renk varsa onu kullan, yoksa varsayılan renk ver
                        var renk = ulkeRenkleri[name] || "#4a5568";
                        return {
                            fillColor: renk,
                            weight: 1,
                            opacity: 1,
                            color: '#ffffff',
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        layer.on('click', function(e) {
                            secilenUlke = feature.properties.name;
                            document.getElementById('ulke-adi').innerText = secilenUlke;
                            
                            var asker = Math.floor(Math.random() * 50000) + 5000;
                            var ekonomi = "$" + (Math.floor(Math.random() * 900) + 100) + "M";
                            
                            document.getElementById('asker').innerText = asker.toLocaleString() + " Asker";
                            document.getElementById('ekonomi').innerText = ekonomi;
                            document.getElementById('durum').innerText = secilenUlke + " ülkesinin bilgileri görüntüleniyor.";
                        });
                    }
                }).addTo(map);
            });

        /* DANIŞMAN SOHBET MANTIĞI */
        function toggleChat() {
            var chat = document.getElementById('advisor-chat');
            chat.style.display = (chat.style.display === 'flex') ? 'none' : 'flex';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if(!text) return;

            var body = document.getElementById('chat-body');
            var userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.innerText = text;
            body.appendChild(userMsg);
            input.value = '';
            body.scrollTop = body.scrollHeight;

            setTimeout(function() {
                var botMsg = document.createElement('div');
                botMsg.className = 'msg bot';
                botMsg.innerText = getAdvisorReply(text.toLowerCase());
                body.appendChild(botMsg);
                body.scrollTop = body.scrollHeight;
            }, 600);
        }

        function getAdvisorReply(q) {
            if(q.includes('ekonomi') || q.includes('para') || q.includes('kalkın')) {
                return "Ekonomiyi büyütmek için yatırımları artırmalı ve ticaret yollarını güvenceye almalısınız!";
            } else if(q.includes('ordu') || q.includes('asker')) {
                return "Sınır güvenliği için ordu kapasitesini yüksek tutmak her zaman avantaj sağlar.";
            } else {
                return "Efendim, haritadaki renkli bölgeleri inceleyerek stratejinizi belirleyebilirsiniz.";
            }
        }
    </script>
</body>
</html>
