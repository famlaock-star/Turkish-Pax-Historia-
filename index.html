<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,
maximum-scale=1,user-scalable=no">

<title>Turkish Pax Historia</title>

<!-- LEAFLET -->
<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#b8c7cf;
}

/* ================= HARİTA ================= */

#map{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

.leaflet-control-attribution{
    font-size:8px;
}

/* ================= ALT BUTONLAR ================= */

.mainButton{
    position:fixed;
    bottom:12px;

    z-index:5000;

    border:2px solid #555;
    border-radius:12px;

    padding:11px 15px;

    background:#20252b;
    color:white;

    font-size:14px;
    font-weight:bold;

    box-shadow:0 4px 12px #0008;

    touch-action:manipulation;
}

#chatButton{
    left:10px;
}

#advisorButton{
    right:10px;
}

/* ================= EKRANLAR ================= */

.screen{
    position:fixed;
    inset:0;

    z-index:10000;

    display:none;
    flex-direction:column;

    background:white;
    color:#222;
}

/* ================= ÜST BAR ================= */

.top{
    height:58px;
    min-height:58px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:7px 10px;

    border-bottom:1px solid #ddd;
}

.top button{
    border:1px solid #bbb;
    border-radius:8px;

    padding:8px 10px;

    background:#f3f3f3;
    color:#222;

    touch-action:manipulation;
}

.title{
    font-size:16px;
    font-weight:bold;
}

/* ================= CHAT ================= */

.chatCenter{
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#777;
    text-align:center;
}

.bigIcon{
    font-size:55px;
    margin-bottom:10px;
}

.chatBottom{
    padding:9px;
    border-top:1px solid #ddd;
}

#countryChatButton,
#createGroupButton{
    width:100%;
    height:43px;

    margin-bottom:7px;

    border:1px solid #bbb;
    border-radius:9px;

    background:#f5f5f5;
    font-weight:bold;
}

/* ================= KAYITLI ÜLKELER ================= */

#savedContacts{
    max-height:180px;
    overflow-y:auto;

    border-bottom:1px solid #ddd;
}

.contact{
    display:flex;
    align-items:center;

    padding:11px;

    border-bottom:1px solid #eee;

    cursor:pointer;
    touch-action:manipulation;
}

.contactFlag{
    font-size:25px;
    width:42px;
}

.contactName{
    font-weight:bold;
}

.contactSub{
    font-size:12px;
    color:#888;
    margin-top:3px;
}

/* ================= ÜLKE SEÇ ================= */

.searchArea{
    padding:10px;
    border-bottom:1px solid #ddd;
}

#countrySearch{
    width:100%;
    height:43px;

    border:1px solid #bbb;
    border-radius:9px;

    padding:0 12px;

    font-size:15px;
}

#countryList{
    flex:1;
    overflow-y:auto;
    padding:5px 10px;
}

.countryItem{
    width:100%;

    display:flex;
    align-items:center;
    gap:12px;

    padding:12px 8px;

    border:0;
    border-bottom:1px solid #eee;

    background:white;

    text-align:left;

    font-size:15px;

    touch-action:manipulation;
}

.countryFlag{
    font-size:25px;
    width:35px;
}

/* ================= ÜLKE CHAT ================= */

.messages{
    flex:1;
    overflow-y:auto;
    padding:14px;
}

.message{
    max-width:82%;

    padding:10px 13px;
    margin:8px 0;

    border-radius:12px;

    line-height:1.4;

    word-break:break-word;
}

.userMessage{
    margin-left:auto;
    background:#e5edf6;
}

.aiMessage{
    margin-right:auto;
    background:#f0f0f0;
}

.inputArea{
    display:flex;
    gap:7px;

    padding:9px;

    border-top:1px solid #ddd;
}

.inputArea input{
    flex:1;
    min-width:0;

    height:42px;

    border:1px solid #bbb;
    border-radius:9px;

    padding:0 11px;

    font-size:15px;
}

.inputArea button{
    border:0;
    border-radius:9px;

    padding:0 15px;

    background:#303942;
    color:white;

    font-weight:bold;
}

/* ================= GRUP ================= */

#groupList{
    flex:1;
    overflow-y:auto;
    padding:10px;
}

.groupItem{
    padding:14px;

    margin-bottom:8px;

    border:1px solid #ddd;
    border-radius:10px;

    background:#fafafa;

    font-weight:bold;
}

.groupMembers{
    font-size:12px;
    color:#777;
    margin-top:5px;
}

/* ================= DANIŞMAN ================= */

#advisorMessages{
    flex:1;
    overflow-y:auto;
    padding:14px;
}

.advisorMessage{
    max-width:82%;

    padding:11px 13px;
    margin:8px 0;

    border-radius:12px;

    line-height:1.4;

    white-space:pre-wrap;
}

.advisorUser{
    margin-left:auto;
    background:#e5edf6;
}

.advisorAI{
    margin-right:auto;
    background:#f0f0f0;
}

.advisorQuestions{
    display:flex;
    gap:7px;

    padding:8px;

    overflow-x:auto;

    border-top:1px solid #ddd;
}

.advisorQuestion{
    flex-shrink:0;

    padding:9px 11px;

    border:1px solid #bbb;
    border-radius:9px;

    background:#f5f5f5;
}

button{
    cursor:pointer;
}

/* ================= MOBİL ================= */

@media(max-width:600px){

    .mainButton{
        bottom:8px;
        padding:10px 12px;
        font-size:13px;
    }

    #chatButton{
        left:8px;
    }

    #advisorButton{
        right:8px;
    }

    .title{
        font-size:14px;
    }

    .top button{
        font-size:10px;
        padding:7px;
    }

}

</style>
</head>

<body>

<!-- HARİTA -->

<div id="map"></div>

<!-- ANA BUTONLAR -->

<button id="chatButton" class="mainButton">
    💬 Chat
</button>

<button id="advisorButton" class="mainButton">
    🧠 Danışman
</button>


<!-- ================= CHAT ================= -->

<div id="chatScreen" class="screen">

    <div class="top">

        <button id="chatClose">
            ← Çık
        </button>

        <div class="title">
            💬 Chat
        </div>

        <div style="width:45px"></div>

    </div>

    <!-- DAHA ÖNCE İLETİŞİM KURULANLAR -->

    <div id="savedContacts"></div>

    <div class="chatCenter">

        <div>
            <div class="bigIcon">💬</div>
            <div>
                Ülkelerle iletişim kur
            </div>
        </div>

    </div>

    <div class="chatBottom">

        <button id="countryChatButton">
            🌍 Bir ülkeyle iletişime geç
        </button>

        <button id="createGroupButton">
            👥 Grup oluştur
        </button>

    </div>

</div>


<!-- ================= ÜLKE SEÇ ================= -->

<div id="countryScreen" class="screen">

    <div class="top">

        <button id="countryBack">
            ← Geri
        </button>

        <div class="title">
            🌍 Ülke Seç
        </div>

        <div style="width:45px"></div>

    </div>

    <div class="searchArea">

        <input
            id="countrySearch"
            placeholder="🔎 Ülke ara..."
            autocomplete="off">

    </div>

    <div id="countryList"></div>

</div>


<!-- ================= ÜLKE CHAT ================= -->

<div id="countryChatScreen" class="screen">

    <div class="top">

        <button id="countryChatBack">
            ← Geri
        </button>

        <div id="selectedCountryTitle"
             class="title">
            🌍 Ülke
        </div>

        <div style="width:45px"></div>

    </div>

    <div id="countryMessages"
         class="messages">
    </div>

    <div class="inputArea">

        <input
            id="countryMessageInput"
            placeholder="Mesaj yaz..."
            autocomplete="off">

        <button id="countrySend">
            Gönder
        </button>

    </div>

</div>


<!-- ================= GRUP ================= -->

<div id="groupScreen" class="screen">

    <div class="top">

        <button id="groupBack">
            ← Geri
        </button>

        <div class="title">
            👥 Gruplar
        </div>

        <div style="width:45px"></div>

    </div>

    <div id="groupList"></div>

</div>


<!-- ================= DANIŞMAN ================= -->

<div id="advisorScreen" class="screen">

    <div class="top">

        <button id="advisorClose">
            ← Çık
        </button>

        <div class="title">
            🧠 Pax Historia Danışmanı
        </div>

        <button id="advisorClear">
            Temizle
        </button>

    </div>

    <div id="advisorMessages"></div>

    <div class="advisorQuestions">

        <button class="advisorQuestion">
            🌍 Jeopolitik durum
        </button>

        <button class="advisorQuestion">
            💰 Ekonomi
        </button>

        <button class="advisorQuestion">
            ⚔️ Savaş
        </button>

        <button class="advisorQuestion">
            🪖 Ordu
        </button>

    </div>

    <div class="inputArea">

        <input
            id="advisorInput"
            placeholder="Danışmana yaz..."
            autocomplete="off">

        <button id="advisorSend">
            Gönder
        </button>

    </div>

</div>


<script>

/* =====================================================
   HARİTA
===================================================== */

const map =
    L.map("map",{

        zoomControl:false,

        minZoom:2,
        maxZoom:7,

        worldCopyJump:false,

        maxBounds:[
            [-85,-180],
            [85,180]
        ],

        maxBoundsViscosity:1.0

    });


L.control.zoom({
    position:"topright"
}).addTo(map);


map.setView(
    [30,20],
    2
);


/* HARİTA */

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:7,
        attribution:"© OpenStreetMap"
    }
).addTo(map);


/* =====================================================
   ELEMENTLER
===================================================== */

const chatScreen =
    document.getElementById("chatScreen");

const countryScreen =
    document.getElementById("countryScreen");

const countryChatScreen =
    document.getElementById("countryChatScreen");

const groupScreen =
    document.getElementById("groupScreen");

const advisorScreen =
    document.getElementById("advisorScreen");

const countryList =
    document.getElementById("countryList");

const countrySearch =
    document.getElementById("countrySearch");

const savedContacts =
    document.getElementById("savedContacts");

const countryMessages =
    document.getElementById("countryMessages");

const countryMessageInput =
    document.getElementById("countryMessageInput");

const selectedCountryTitle =
    document.getElementById("selectedCountryTitle");

const advisorMessages =
    document.getElementById("advisorMessages");

let selectedCountry = null;


/* =====================================================
   ÜLKELER
===================================================== */

const countries = [

["🇹🇷","Türkiye"],
["🇺🇸","Amerika Birleşik Devletleri"],
["🇬🇧","Birleşik Krallık"],
["🇩🇪","Almanya"],
["🇫🇷","Fransa"],
["🇮🇹","İtalya"],
["🇪🇸","İspanya"],
["🇵🇹","Portekiz"],
["🇳🇱","Hollanda"],
["🇧🇪","Belçika"],
["🇨🇭","İsviçre"],
["🇦🇹","Avusturya"],
["🇵🇱","Polonya"],
["🇨🇿","Çekya"],
["🇭🇺","Macaristan"],
["🇷🇴","Romanya"],
["🇧🇬","Bulgaristan"],
["🇬🇷","Yunanistan"],
["🇷🇺","Rusya"],
["🇺🇦","Ukrayna"],
["🇧🇾","Belarus"],
["🇸🇪","İsveç"],
["🇳🇴","Norveç"],
["🇫🇮","Finlandiya"],
["🇩🇰","Danimarka"],
["🇮🇸","İzlanda"],
["🇮🇪","İrlanda"],
["🇷🇸","Sırbistan"],
["🇭🇷","Hırvatistan"],
["🇧🇦","Bosna-Hersek"],
["🇦🇱","Arnavutluk"],
["🇲🇪","Karadağ"],
["🇲🇰","Kuzey Makedonya"],
["🇸🇮","Slovenya"],

["🇨🇳","Çin"],
["🇯🇵","Japonya"],
["🇰🇷","Güney Kore"],
["🇰🇵","Kuzey Kore"],
["🇮🇳","Hindistan"],
["🇵🇰","Pakistan"],
["🇦🇫","Afganistan"],
["🇮🇷","İran"],
["🇮🇶","Irak"],
["🇸🇦","Suudi Arabistan"],
["🇮🇱","İsrail"],
["🇯🇴","Ürdün"],
["🇱🇧","Lübnan"],
["🇸🇾","Suriye"],
["🇬🇪","Gürcistan"],
["🇦🇲","Ermenistan"],
["🇦🇿","Azerbaycan"],
["🇰🇿","Kazakistan"],
["🇺🇿","Özbekistan"],

["🇪🇬","Mısır"],
["🇱🇾","Libya"],
["🇩🇿","Cezayir"],
["🇲🇦","Fas"],
["🇹🇳","Tunus"],
["🇸🇩","Sudan"],
["🇪🇹","Etiyopya"],
["🇰🇪","Kenya"],
["🇳🇬","Nijerya"],
["🇿🇦","Güney Afrika"],
["🇨🇩","Kongo Demokratik Cumhuriyeti"],
["🇬🇭","Gana"],

["🇨🇦","Kanada"],
["🇲🇽","Meksika"],
["🇧🇷","Brezilya"],
["🇦🇷","Arjantin"],
["🇨🇱","Şili"],
["🇨🇴","Kolombiya"],
["🇵🇪","Peru"],
["🇻🇪","Venezuela"],
["🇨🇺","Küba"],
["🇵🇦","Panama"],

["🇦🇺","Avustralya"],
["🇳🇿","Yeni Zelanda"],
["🇮🇩","Endonezya"],
["🇲🇾","Malezya"],
["🇹🇭","Tayland"],
["🇻🇳","Vietnam"],
["🇵🇭","Filipinler"],
["🇸🇬","Singapur"]

];


/* =====================================================
   CHAT
===================================================== */

document.getElementById("chatButton")
.onclick = function(){

    chatScreen.style.display="flex";

    renderContacts();

};


document.getElementById("chatClose")
.onclick = function(){

    chatScreen.style.display="none";

};


/* =====================================================
   ÜLKE SEÇ
===================================================== */

document.getElementById("countryChatButton")
.onclick = function(){

    chatScreen.style.display="none";

    countryScreen.style.display="flex";

    countrySearch.value="";

    renderCountries();

    setTimeout(
        ()=>countrySearch.focus(),
        100
    );

};


document.getElementById("countryBack")
.onclick = function(){

    countryScreen.style.display="none";

    chatScreen.style.display="flex";

};


/* =====================================================
   ÜLKE LİSTESİ
===================================================== */

function renderCountries(){

    const search =
        countrySearch.value
        .toLowerCase()
        .trim();

    countryList.innerHTML="";

    countries
    .filter(c =>
        c[1]
        .toLowerCase()
        .includes(search)
    )
    .forEach(c => {

        const button =
            document.createElement("button");

        button.className="countryItem";

        button.innerHTML =
            `<span class="countryFlag">${c[0]}</span>
             <span>${c[1]}</span>`;

        button.onclick = function(){

            openCountry(c);

        };

        countryList.appendChild(button);

    });

}


countrySearch
.addEventListener(
    "input",
    renderCountries
);


/* =====================================================
   ÜLKEYİ AÇ
===================================================== */

function openCountry(country){

    selectedCountry = country;

    countryScreen.style.display="none";

    countryChatScreen.style.display="flex";

    selectedCountryTitle.textContent =
        country[0]+" "+country[1];

    countryMessages.innerHTML="";

    addCountryMessage(
        country[1]+
        " ile diplomatik iletişim kanalı açıldı.",
        "ai"
    );

    saveContact(country);

    renderContacts();

    setTimeout(
        ()=>countryMessageInput.focus(),
        100
    );

}


/* =====================================================
   ÜLKE CHAT GERİ
===================================================== */

document.getElementById("countryChatBack")
.onclick = function(){

    countryChatScreen.style.display="none";

    chatScreen.style.display="flex";

    renderContacts();

};


/* =====================================================
   KAYITLI ÜLKELER
===================================================== */

let contacts =
    JSON.parse(
        localStorage.getItem(
            "paxContacts"
        ) || "[]"
    );


function saveContact(country){

    const exists =
        contacts.some(
            c=>c[1]===country[1]
        );

    if(!exists){

        contacts.push(country);

        localStorage.setItem(
            "paxContacts",
            JSON.stringify(contacts)
        );

    }

}


function renderContacts(){

    savedContacts.innerHTML="";

    contacts.forEach(country=>{

        const div =
            document.createElement("div");

        div.className="contact";

        div.innerHTML =
            `<div class="contactFlag">
                ${country[0]}
             </div>
             <div>
                <div class="contactName">
                    ${country[1]}
                </div>
                <div class="contactSub">
                    Diplomatik iletişim
                </div>
             </div>`;

        div.onclick = function(){

            openCountry(country);

        };

        savedContacts.appendChild(div);

    });

}


/* =====================================================
   ÜLKE MESAJI
===================================================== */

function addCountryMessage(
    text,
    type
){

    const div =
        document.createElement("div");

    div.className =
        "message "+
        (
            type==="user"
            ? "userMessage"
            : "aiMessage"
        );

    div.textContent=text;

    countryMessages.appendChild(div);

    countryMessages.scrollTop =
        countryMessages.scrollHeight;

}


function countryReply(text){

    const q =
        text.toLowerCase();

    if(q.includes("savaş"))
        return selectedCountry[1]+
        " savaş konusunda temkinli bir tutum sergiliyor.";

    if(q.includes("ticaret"))
        return selectedCountry[1]+
        " ticaret anlaşmalarını görüşmeye hazır.";

    if(q.includes("ittifak"))
        return selectedCountry[1]+
        " olası bir ittifak teklifini değerlendiriyor.";

    if(q.includes("barış"))
        return selectedCountry[1]+
        " barışçıl diplomatik görüşmelere açık.";

    return selectedCountry[1]+
        " mesajınızı aldı. Diplomatik ilişkiler devam ediyor.";

}


function sendCountryMessage(){

    const text =
        countryMessageInput.value.trim();

    if(!text || !selectedCountry)
        return;

    addCountryMessage(
        text,
        "user"
    );

    countryMessageInput.value="";

    setTimeout(()=>{

        addCountryMessage(
            countryReply(text),
            "ai"
        );

    },500);

}


document.getElementById("countrySend")
.onclick =
    sendCountryMessage;


countryMessageInput
.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){

            e.preventDefault();

            sendCountryMessage();

        }

    }
);


/* =====================================================
   GRUP SİSTEMİ
===================================================== */

let groups =
    JSON.parse(
        localStorage.getItem(
            "paxGroups"
        ) || "[]"
    );


document.getElementById("createGroupButton")
.onclick = function(){

    const name =
        prompt(
            "Grup adı:"
        );

    if(!name)
        return;

    const memberNames =
        contacts.map(
            c=>c[1]
        );

    groups.push({

        name:name,

        members:memberNames

    });

    localStorage.setItem(
        "paxGroups",
        JSON.stringify(groups)
    );

    renderGroups();

    chatScreen.style.display="none";

    groupScreen.style.display="flex";

};


document.getElementById("groupBack")
.onclick = function(){

    groupScreen.style.display="none";

    chatScreen.style.display="flex";

};


function renderGroups(){

    const list =
        document.getElementById(
            "groupList"
        );

    list.innerHTML="";

    if(groups.length===0){

        list.innerHTML =
            `<div style="
                text-align:center;
                color:#777;
                padding:30px;
            ">
                Henüz grup yok.
            </div>`;

        return;

    }

    groups.forEach(group=>{

        const div =
            document.createElement("div");

        div.className="groupItem";

        div.innerHTML =
            `
